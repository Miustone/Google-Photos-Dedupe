name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies & Run Unit Tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          python -m unittest discover -s tests -v

      - name: Build Executable with PyInstaller
        run: |
          python -m PyInstaller --onefile --noconfirm --windowed --name "GooglePhotosDedupe" app.py

      - name: Parse Version & Changelog Section
        id: parse_changelog
        shell: powershell
        run: |
          if (Test-Path "CHANGELOG.md") {
              $content = Get-Content "CHANGELOG.md" -Raw
              if ($content -match '##\s*\[?([vV]?\d+\.\d+\.\d+)\]?') {
                  $rawVersion = $matches[1]
                  $cleanVersion = "V" + ($rawVersion -replace '^[vV]', '')
                  $versionNumberOnly = $cleanVersion -replace '^[vV]', ''
                  $regex = "(?s)## \[?(?:[vV]?)$versionNumberOnly\]?.*?(?=(## \[\d+|## \[[vV]\d+|\z))"
                  if ($content -match $regex) {
                      Set-Content -Path "release_notes.md" -Value $matches[0].Trim()
                  } else {
                      Set-Content -Path "release_notes.md" -Value "Release $cleanVersion"
                  }
                  echo "version=$cleanVersion" >> $env:GITHUB_OUTPUT
              } else {
                  $fallback = "V1.0.${{ github.run_number }}"
                  Set-Content -Path "release_notes.md" -Value "Release $fallback"
                  echo "version=$fallback" >> $env:GITHUB_OUTPUT
              }
          } else {
              $fallback = "V1.0.${{ github.run_number }}"
              Set-Content -Path "release_notes.md" -Value "Release $fallback"
              echo "version=$fallback" >> $env:GITHUB_OUTPUT
          }

      - name: Create GitHub Release and Upload .exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.parse_changelog.outputs.version }}
          name: Google Photos Dedupe ${{ steps.parse_changelog.outputs.version }}
          body_path: release_notes.md
          files: dist/GooglePhotosDedupe.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
